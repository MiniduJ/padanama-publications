name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_CLI_EXPERIMENTS: webframeworks

jobs:
  validate:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret-at-least-32-characters-long

  deploy:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    # Production on main; preview URL for PRs from this repo (forks have no secrets)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      VERCEL_ORG_ID: team_8LvTTDVjrQFo779ij9g6Axsx
      VERCEL_PROJECT_ID: prj_qLicNZy1KKNm4HkgVANeOx9Rumb3
    steps:
      - uses: actions/checkout@v4

      # Vercel builds remotely with its own env vars (DATABASE_URL is sensitive and cannot be pulled).
      # The `vercel-build` script syncs the schema and seeds the catalogue on first deploy.
      - name: Deploy
        id: deploy
        run: echo "url=$(npx vercel@latest deploy ${{ github.event_name != 'pull_request' && '--prod' || '' }} --yes --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - run: echo "Deployed ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
